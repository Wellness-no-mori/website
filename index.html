<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- 🖼️ タブアイコン（キャッシュを強制破棄して透明化を即時反映させる指定） -->
    <link rel="icon" href="logo.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <title>ウェルネスの森を守る会 | 入口</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: #f9f8f6; 
            color: #292524; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            -webkit-font-smoothing: antialiased; 
            box-sizing: border-box; 
            padding: 2rem 1.5rem; 
        }
        .container { text-align: center; max-width: 400px; width: 100%; }
        
        /* 📸 ロゴリンクエリア */
        .logo-link { 
            display: inline-block; 
            text-decoration: none; 
            transition: transform 0.2s ease, opacity 0.2s ease; 
            cursor: pointer; 
            background: none !important;
            border: none !important;
            outline: none !important;
        }
        .logo-link:hover { 
            transform: scale(1.03); 
            opacity: 0.9;
        }
        .logo-link:active { 
            transform: scale(0.98); 
        }

        /* 📸 ロゴ表示エリア */
        .logo-container { 
            width: 240px; 
            height: 240px; 
            margin: 0 auto; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: none !important;
        }
        .logo-img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block; 
            border: none !important; 
            outline: none !important; 
            background: none !important;
        }
        
        /* 📝 案内コメント用スタイル */
        .guide-text { 
            margin-top: 1.5rem; 
            font-size: 0.95rem; 
            color: #57534e; 
            font-weight: 500; 
            letter-spacing: 0.05em; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 📸 本体にも透明PNG画像を使用 -->
        <a href="top.html" class="logo-link" title="トップページへ移動">
            <div class="logo-container">
                <img src="logo.png?v=2" alt="ウェルネスの森を守る会 ロゴマーク" class="logo-img" onerror="this.parentElement.style.display='none';">
            </div>
        </a>

        <!-- 📝 ロゴ下の案内文 -->
        <p class="guide-text">ロゴをクリックすると次画面へ…</p>
    </div>

</body>
</html>

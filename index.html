<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- 🖼️ タブアイコン（透明化された logo.png を使用） -->
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">

    <title>ウェルネスの森を守る会 | 入口</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: #f9f8f6; 
            color: #292524; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            -webkit-font-smoothing: antialiased; 
            box-sizing: border-box; 
            padding: 2rem 1.5rem; 
        }
        .container { text-align: center; max-width: 400px; width: 100%; }
        
        /* 📸 ロゴリンクエリア（白浮き防止・シンプルな拡大効果） */
        .logo-link { 
            display: inline-block; 
            text-decoration: none; 
            transition: transform 0.2s ease; 
            cursor: pointer; 
            background: transparent !important;
            outline: none;
        }
        .logo-link:hover { 
            transform: scale(1.04); 
        }
        .logo-link:active { 
            transform: scale(0.98); 
        }

        /* 💡 白背景を画面色(#f9f8f6)と同化させて透過表示するエリア */
        .logo-container { 
            width: 240px; 
            height: 240px; 
            margin: 0 auto; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: transparent !important;
        }
        .logo-img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
            display: block; 
            border: none; 
            outline: none; 
            background: transparent !important;
            /* 乗算処理で画像の白背景のみを透過 */
            mix-blend-mode: multiply; 
        }
        
        /* 📝 案内コメント用スタイル */
        .guide-text { 
            margin-top: 1.5rem; 
            font-size: 0.95rem; 
            color: #57534e; 
            font-weight: 500; 
            letter-spacing: 0.05em; 
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 📸 ロゴ本体は元の logo.jpg を高画質のまま使用 -->
        <a href="top.html" class="logo-link" title="トップページへ移動">
            <div class="logo-container">
                <img src="logo.jpg" alt="ウェルネスの森を守る会 ロゴマーク" class="logo-img" onerror="this.parentElement.style.display='none';">
            </div>
        </a>

        <!-- 📝 ロゴ下の案内文 -->
        <p class="guide-text">ロゴをクリックすると次画面へ…</p>
    </div>

</body>
</html>

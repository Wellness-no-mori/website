<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
　　<meta name="robots" content="noindex, nofollow">
    <!-- パソコンのデスクトップや、スマホのホーム画面用のアイコン指定 -->
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <title>ウェルネスの森を守る会 | 入口</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9f8f6; color: #292524; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; -webkit-font-smoothing: antialiased; box-sizing: border-box; padding: 2rem 1.5rem; }
        .container { text-align: center; max-width: 400px; width: 100%; }
        
        /* 💡ロゴマークの白背景を強制透過させるマジック */
        .logo-container { width: 240px; height: 240px; margin: 0 auto 2.5rem auto; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .logo-img { width: 100%; height: 100%; object-fit: contain; display: block; border: none; outline: none; mix-blend-mode: multiply; /* ←これで白い背景だけを完全に透明化します */ }
        
        .btn { display: block; width: 100%; font-weight: 500; font-size: 1.125rem; padding: 1rem 0; border-radius: 0.75rem; text-decoration: none; box-sizing: border-box; transition: all 0.2s; }
        .enter-btn { background-color: #059669; color: white; margin-bottom: 1rem; box-shadow: 0 10px 15px -3px rgba(6, 150, 105, 0.3); }
        .enter-btn:hover { background-color: #047857; }
        .back-btn { background-color: transparent; color: #57534e; border: 1px solid #d6d3d1; font-size: 0.95rem; padding: 0.75rem 0; }
        .back-btn:hover { background-color: #f5f5f4; color: #2c2a29; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 📸 白いフチがなくなり、背景になじむロゴマークエリア -->
        <div class="logo-container">
            <img src="logo.jpg" alt="ウェルネスの森を守る会 ロゴマーク" class="logo-img" onerror="this.parentElement.style.display='none';">
        </div>

        <a href="top.html" class="btn enter-btn">サイトのトップページへ進む ➔</a>
        <button onclick="history.back()" class="btn back-btn">⬅ 前の画面に戻る</button>
    </div>

</body>
</html>

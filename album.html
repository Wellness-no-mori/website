<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ウェルネスの森を守る会 | 活動アルバム</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9f8f6; color: #292524; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; -webkit-font-smoothing: antialiased; }
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(231, 229, 228, 0.6); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .nav-container { max-width: 1152px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.1em; color: #065f46; margin: 0; }
        
        main { max-width: 896px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; width: 100%; box-sizing: border-box; }
        h2 { font-size: 1.75rem; font-weight: 700; color: #1c1917; margin: 0 0 0.5rem 0; }
        .subtitle { font-size: 0.95rem; color: #57534e; margin-bottom: 2.5rem; }
        
        /* 📋 ステップ1: シンプルなテキストリンク一覧 */
        .folder-list { display: flex; flex-direction: column; gap: 0.8rem; max-width: 400px; margin: 0 auto; text-align: left; }
        .folder-link { color: #2563eb; text-decoration: underline; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: none; border: none; padding: 0; text-align: left; }
        .folder-link:hover { color: #1d4ed8; }

        /* 🖼️ ステップ2: サムネイル画像グリッド */
        .thumbnail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .thumbnail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
        .thumb-card { aspect-ratio: 1 / 1; border-radius: 0.75rem; overflow: hidden; background-color: #e7e5e4; cursor: pointer; position: relative; border: 1px solid #e7e5e4; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.2s; }
        .thumb-card:hover .thumb-img { transform: scale(1.05); }
        /* 🔍 拡大表示モーダル（背景を透けない完全な黒に変更） */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000000; /* 裏ページが透けない完全な黒 */
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
        }
        .modal-overlay.active { display: flex; }
        .modal-content { max-width: 90%; max-height: 70vh; object-fit: contain; border-radius: 0.5rem; }
        
        /* モーダル内の左右矢印ボタン */
        .modal-btn { 
            position: absolute; 
            background-color: rgba(255, 255, 255, 0.2); 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            font-size: 1.5rem; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: all 0.2s; 
            line-height: 1; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* 🎯 茶色の「閉じる」ボタン */
        .btn-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background-color: #78350f !important; /* 濃い茶色 */
            color: #ffffff !important;            /* 白文字 */
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.5rem 1.2rem !important;
            border-radius: 2rem !important;      /* 保存ボタンと同じ角丸 */
            border: none !important;
            cursor: pointer;
            z-index: 1010;
            width: auto !important;
            height: auto !important;
            white-space: nowrap;                 /* 文字の折り返しを防止 */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            -webkit-appearance: none;
        }
        .btn-close:hover {
            background-color: #451a03 !important; /* ホバー時に少し濃い茶色 */
        }
        .btn-prev { left: 0.75rem; top: 50%; transform: translateY(-50%); }
        .btn-next { right: 0.75rem; top: 50%; transform: translateY(-50%); }

        /* DLボタン（縦崩れ防止・横一列表示） */
        .btn-download { 
            position: absolute;
            bottom: 2rem; 
            background-color: #059669; 
            color: #ffffff;
            font-size: 0.95rem; 
            width: auto !important; 
            height: auto !important; 
            padding: 0.75rem 1.5rem !important; 
            border-radius: 2rem !important; 
            text-decoration: none; 
            font-weight: 500; 
            border: none !important; 
            white-space: nowrap; /* 文字の折り返しを禁止 */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        .btn-download:hover { background-color: #047857; }

        .loading-text { font-size: 1.1rem; color: #059669; font-weight: 500; margin: 2rem 0; }
        .sub-btn { background-color: #e7e5e4; color: #44403c; border: 1px solid #d6d3d1; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; text-decoration: none; font-size: 0.9rem; }
        .sub-btn:hover { background-color: #d6d3d1; }
        
        .btn-container { margin-top: 3rem; }
        .back-btn { display: inline-block; background-color: transparent; color: #57534e; border: 1px solid #d6d3d1; font-weight: 500; font-size: 1rem; padding: 0.75rem 2.5rem; border-radius: 0.75rem; text-decoration: none; transition: all 0.2s; cursor: pointer; }
        .back-btn:hover { background-color: #f5f5f4; color: #2c2a29; }
        footer { background-color: #1c1917; color: #a8a29e; padding: 2rem 0; text-align: center; font-size: 0.75rem; border-top: 1px solid #292524; margin-top: auto; }
        
        /* 📱 幅1024px以下（スマホ・小型タブレット・ウィンドウを狭めたPC）用の調整 */
        @media (max-width: 1024px) {
            h2 { font-size: 1.4rem; }
            .thumbnail-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
            .modal-btn { width: 44px; height: 44px; }
            .btn-prev { left: 0.75rem; }
            .btn-next { right: 0.75rem; }
            .btn-close { top: 1rem; right: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <h1>ウェルネスの森を守る会</h1>
        </div>
    </header>

    <main>
        <h2 id="pageTitle">活動の記録（アルバム）</h2>
        <p id="pageSubtitle" class="subtitle">これまでの保全活動の様子を写真でご覧いただけます。</p>
        
        <div id="loading" class="loading-text">🔄 写真データを読み込んでいます...</div>

        <!-- 📋 ステップ1: リスト表示エリア -->
        <div id="folderListView" class="folder-list" style="display: none;"></div>

        <!-- 🖼️ ステップ2: サムネイル一覧表示エリア -->
        <div id="thumbnailView" style="display: none;">
            <div class="thumbnail-header">
                <button onclick="showFolderList()" class="sub-btn">⬅ 年月選択に戻る</button>
            </div>
            <div id="thumbnailGrid" class="thumbnail-grid"></div>
        </div>

        <!-- 🔍 拡大モーダル表示エリア -->
        <div id="imageModal" class="modal-overlay">
            <!-- 🎯 茶色の「閉じる」ボタン -->
            <button class="btn-close" onclick="closeModal()" aria-label="閉じる">閉じる</button>
            
            <button class="modal-btn btn-prev" onclick="prevImage()" aria-label="前の画像">❮</button>
            <img id="modalImg" class="modal-content" src="" alt="拡大写真">
            <button class="modal-btn btn-next" onclick="nextImage()" aria-label="次の画像">❯</button>
            <a id="downloadBtn" class="modal-btn btn-download" href="" download target="_blank">📥 この写真を保存</a>
        </div>
        <!-- 戻るボタン -->
        <div class="btn-container">
            <button onclick="history.back()" class="back-btn">⬅ 前の画面に戻る</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ウェルネスの森を守る会. All rights reserved.</p>
    </footer>

    <script>
        let allAlbumsData = {}; 
        let currentFolderPhotos = []; 
        let currentPhotoIndex = 0; 

        async function loadAlbumData() {
            const loadingEl = document.getElementById("loading");
            
            try {
                const response = await fetch('album_list.csv');
                if (!response.ok) throw new Error('CSVファイルの取得に失敗しました');
                
                const text = await response.text();
                const lines = text.split('\n');
                
                allAlbumsData = {};
                
                lines.forEach(line => {
                    if (!line.trim()) return;
                    const parts = line.split(',');
                    if (parts.length < 2) return;
                    
                    const ym = parts[0].trim();       
                    const photoId = parts[1].trim();  
                    
                    if (!allAlbumsData[ym]) {
                        allAlbumsData[ym] = [];
                    }
                    allAlbumsData[ym].push(photoId);
                });

                loadingEl.style.display = "none";
                showFolderList();

            } catch (error) {
                console.error(error);
                loadingEl.innerText = "❌ データの読み込みに失敗しました。";
            }
        }

        function showFolderList() {
            document.getElementById("pageTitle").textContent = "活動の記録（アルバム）";
            document.getElementById("pageSubtitle").textContent = "ご覧になりたい活動の年月を選択してください。";
            document.getElementById("thumbnailView").style.display = "none";
            
            const listView = document.getElementById("folderListView");
            listView.innerHTML = "";
            
            const sortedYears = Object.keys(allAlbumsData).sort().reverse();
            let hasValidFolder = false;

            sortedYears.forEach(ym => {
                const photos = allAlbumsData[ym];
                if (!photos || photos.length === 0) return;

                hasValidFolder = true;
                const [year, month] = ym.split('-');
                
                const item = document.createElement("button");
                item.className = "folder-link";
                item.onclick = () => showImages(ym);
                item.textContent = `${year}年${parseInt(month, 10)}月の活動`;
                listView.appendChild(item);            });

            if (!hasValidFolder) {
                listView.innerHTML = '<div style="color: #78716c;">公開中の写真アルバムはありません。</div>';
            }

            listView.style.display = "flex";
        }

        function showImages(ym) {
            currentFolderPhotos = allAlbumsData[ym] || [];
            if (currentFolderPhotos.length === 0) return;

            openModal(0);
        }

        function openModal(index) {
            currentPhotoIndex = index;
            updateModalImage();
            document.getElementById("imageModal").classList.add("active");
        }

        function closeModal() {
            document.getElementById("imageModal").classList.remove("active");
        }

        function updateModalImage() {
            const photoId = currentFolderPhotos[currentPhotoIndex];
            const largeUrl = `https://drive.google.com/thumbnail?id=${photoId}&sz=w1600`;
            const downloadUrl = `https://drive.google.com/uc?export=download&id=${photoId}`;
            
            document.getElementById("modalImg").src = largeUrl;
            document.getElementById("downloadBtn").href = downloadUrl;
        }

        function prevImage() {
            currentPhotoIndex = (currentPhotoIndex - 1 + currentFolderPhotos.length) % currentFolderPhotos.length;
            updateModalImage();
        }

        function nextImage() {
            currentPhotoIndex = (currentPhotoIndex + 1) % currentFolderPhotos.length;
            updateModalImage();
        }

        window.addEventListener('DOMContentLoaded', loadAlbumData);
    </script>
</body>
</html>

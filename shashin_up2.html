<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像のアップロード (複数対応) - ウェルネスの森を守る会</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9f8f6; color: #292524; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(231, 229, 228, 0.6); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .nav-container { max-width: 1152px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.1em; color: #065f46; margin: 0; }
        
        main { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.15rem; width: 100%; box-sizing: border-box; flex-grow: 1; }
        .card { background-color: white; border-radius: 1.5rem; padding: 2.25rem 1.75rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02); border: 1px solid #e7e5e4; }
        h2 { font-size: 1.35rem; font-weight: 700; color: #1c1917; margin: 0 0 1.5rem 0; line-height: 1.5; text-align: center; }
        
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-label { display: block; font-weight: 700; margin-bottom: 0.5rem; color: #44403c; font-size: 0.95rem; }
        
        input[type="text"], select, input[type="file"] { width: 100%; padding: 0.85rem 1rem; font-size: 1rem; border: 1px solid #d6d3d1; border-radius: 0.75rem; background-color: #fafaf9; box-sizing: border-box; color: #1c1917; font-family: inherit; }
        input[type="text"]:focus, select:focus, input[type="file"]:focus { border-color: #059669; background-color: white; outline: none; box-shadow: 0 0 0 3px rgba(6, 150, 105, 0.1); }
        input[type="file"] { padding: 0.6rem 0.8rem; background-color: #f5f5f4; cursor: pointer; }
        
        /* 🖼️ サムネイル一覧エリア */
        .preview-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); 
            gap: 0.75rem; 
            margin-top: 0.75rem; 
            min-height: 110px;
            max-height: 320px; /* ボタンが見えるよう適度な上限を設定 */
            overflow-y: auto; 
            resize: vertical; /* 手動で縦幅を拡張可能 */
            padding: 0.5rem; 
            background: #fafaf9; 
            border-radius: 0.75rem; 
            border: 1px dashed #d6d3d1; 
            box-sizing: border-box;
        }
        .preview-item { position: relative; aspect-ratio: 1; border-radius: 0.5rem; overflow: hidden; background: #e7e5e4; border: 1px solid #d6d3d1; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* 💡 削除ボタンの背景：グレー */
        .preview-item .remove-btn { 
            position: absolute; 
            top: 3px; 
            right: 3px; 
            background: rgba(107, 114, 128, 0.85); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 22px; 
            height: 22px; 
            font-size: 13px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            line-height: 1; 
        }
        .preview-item .remove-btn:hover { background: #374151; }
        .preview-count { font-size: 0.85rem; color: #059669; font-weight: 700; margin-top: 0.4rem; }

        /* 📊 プログレスバー */
        .progress-container { display: none; margin-top: 1.25rem; background-color: #e7e5e4; border-radius: 9999px; height: 12px; overflow: hidden; width: 100%; }
        .progress-bar { background-color: #059669; height: 100%; width: 0%; transition: width 0.3s ease; }

        .btn-container { display: flex; gap: 1rem; margin-top: 1.25rem; }
        .btn { flex: 1; padding: 0.95rem 0; border-radius: 0.75rem; font-weight: 700; font-size: 1.05rem; text-decoration: none; transition: all 0.2s; box-sizing: border-box; text-align: center; cursor: pointer; border: none; }
        
        .btn-primary { background-color: #059669; color: white; box-shadow: 0 4px 6px -1px rgba(6, 150, 105, 0.2); }
        .btn-primary:hover:not(:disabled) { background-color: #047857; }
        .btn-primary:disabled { background-color: #a7f3d0; cursor: not-allowed; box-shadow: none; }
        .btn-secondary { background-color: #e7e5e4; color: #44403c; border: 1px solid #d6d3d1; }
        .btn-secondary:hover { background-color: #d6d3d1; }
        
        .status-msg { text-align: center; font-weight: 700; margin-top: 1.25rem; white-space: pre-wrap; font-size: 0.95rem; line-height: 1.6; }
        .success { color: #059669; }
        .error { color: #b91c1c; }
        
        footer { background-color: #1c1917; color: #a8a29e; padding: 2rem 0; text-align: center; font-size: 0.75rem; border-top: 1px solid #292524; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <h1>ウェルネスの森を守る会</h1>
        </div>
    </header>

    <main>
        <div class="card">
            <h2>📸 画像のアップロード（複数可）</h2>
            
            <!-- 📅 過去イベントの選択 -->
            <div class="form-group">
                <label class="form-label" for="event-select">対象の活動イベント（過去6件）</label>
                <select id="event-select">
                    <option value="">読み込み中...</option>
                </select>
            </div>

            <!-- 👥 撮影者・投稿者の名前入力 -->
            <div class="form-group">
                <label class="form-label" for="uploader-name">お名前（ニックネーム可）</label>
                <input type="text" id="uploader-name" placeholder="例：山田 太郎">
            </div>

            <!-- 🖼️ 写真ファイルの選択（複数選択対応） -->
            <div class="form-group">
                <label class="form-label" for="file-input">写真を選択（まとめて複数選択できます）</label>
                <input type="file" id="file-input" accept="image/*" multiple onchange="handleFileSelect(event)">
                <div id="preview-count" class="preview-count"></div>
                <div id="preview-grid" class="preview-grid" style="display: none;"></div>
            </div>

            <!-- 📊 プログレスバー -->
            <div id="progress-container" class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <!-- 送信ボタン＆戻るボタンのエリア -->
            <div id="action-area">
                <button type="button" class="btn btn-primary" id="btn-upload" style="width: 100%; margin-top: 1.25rem;" onclick="uploadPhotos()">写真を送信する</button>
                
                <div id="status-area" class="status-msg"></div>

                <div class="btn-container">
                    <a href="member.html" class="btn btn-secondary">↩️ メンバー専用のメニューに戻る</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ウェルネスの森を守る会. All rights reserved.</p>
    </footer>

    <script>
        const ACTIVITY_CSV_URL = "activity.csv";
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz4x4ENhGVuVkh8kTKa4svHBq7UxzT4UtAPvQqRZvvGPN_AKDImD7bm9I6GvvsAPJ3Txg/exec";

        // 🛡️ メンバー認証チェック（10分タイムアウト対応）
        const TIMEOUT_MINUTES = 10;
        const INACTIVE_TIMEOUT = TIMEOUT_MINUTES * 60 * 1000;

        function checkAuthStatus() {
            const isAuth = localStorage.getItem("isMemberAuthenticated") || sessionStorage.getItem("isMemberAuthenticated");
            const authTime = localStorage.getItem("authTimestamp");
            const currentTime = new Date().getTime();

            if (isAuth === "true") {
                if (authTime && (currentTime - parseInt(authTime, 10) > INACTIVE_TIMEOUT)) {
                    localStorage.removeItem("isMemberAuthenticated");
                    localStorage.removeItem("authTimestamp");
                    sessionStorage.removeItem("isMemberAuthenticated");
                    window.location.href = "member.html";
                    return false;
                }
                localStorage.setItem("isMemberAuthenticated", "true");
                sessionStorage.setItem("isMemberAuthenticated", "true");
                localStorage.setItem("authTimestamp", currentTime.toString());
                return true;
            } else {
                window.location.href = "member.html";
                return false;
            }
        }

        if (!checkAuthStatus()) {
            // リダイレクト中
        }

        function extendSession() {
            if (localStorage.getItem("isMemberAuthenticated") === "true") {
                localStorage.setItem("authTimestamp", new Date().getTime().toString());
            }
        }
        ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(eventType => {
            window.addEventListener(eventType, extendSession, { passive: true });
        });

        // 選択された写真の配列管理
        let selectedFiles = [];

        function parseToYMDNumber(str) {
            if (!str) return null;
            const nums = str.match(/\d+/g);
            if (!nums || nums.length < 3) return null;
            return parseInt(`${nums[0]}${nums[1].padStart(2, '0')}${nums[2].padStart(2, '0')}`, 10);
        }

        window.addEventListener("DOMContentLoaded", () => {
            fetch(ACTIVITY_CSV_URL + "?t=" + new Date().getTime())
            .then(res => res.text())
            .then(csvText => {
                setupPastEventOptions(csvText);
            })
            .catch(err => {
                const select = document.getElementById("event-select");
                select.innerHTML = '<option value="">イベントの読み込みに失敗しました</option>';
            });
        });

        function setupPastEventOptions(csvText) {
            const select = document.getElementById("event-select");
            select.innerHTML = "";

            const now = new Date();
            const todayYMD = parseInt(
                now.getFullYear().toString() + 
                (now.getMonth() + 1).toString().padStart(2, '0') + 
                now.getDate().toString().padStart(2, '0'), 
                10
            );

            const lines = csvText.replace(/^\uFEFF/, "").split(/\r?\n/);
            const pastEvents = [];

            lines.forEach(line => {
                if (!line.trim()) return;
                const parts = line.split(",").map(item => item.trim());
                if (parts.length >= 3) {
                    const dateStr = parts[0];
                    const content = parts[2];
                    const eventYMD = parseToYMDNumber(dateStr);

                    if (eventYMD !== null && eventYMD < todayYMD) {
                        const nums = dateStr.match(/\d+/g);
                        const yearMonth = `${nums[0]}${nums[1].padStart(2, '0')}`;
                        
                        pastEvents.push({
                            ymd: eventYMD,
                            folder: yearMonth,
                            content: content,
                            display: `${dateStr} ${content}`
                        });
                    }
                }
            });

            pastEvents.sort((a, b) => b.ymd - a.ymd);
            const recent6 = pastEvents.slice(0, 6);

            if (recent6.length === 0) {
                select.innerHTML = '<option value="">過去の活動イベントはありません</option>';
                return;
            }

            recent6.forEach(ev => {
                const option = document.createElement("option");
                option.value = ev.folder;
                option.dataset.content = ev.content;
                option.text = ev.display;
                select.appendChild(option);
            });
        }

        // 🖼️ ファイル選択時の処理（サムネイルプレビュー描画）
        function handleFileSelect(event) {
            const newFiles = Array.from(event.target.files);
            selectedFiles = [...selectedFiles, ...newFiles];
            updatePreview(true); // 💡 新しくファイルを選択した時はスクロール調整を有効にする
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updatePreview(false);
        }

        function updatePreview(isNewSelection = false) {
            const previewGrid = document.getElementById("preview-grid");
            const previewCount = document.getElementById("preview-count");
            previewGrid.innerHTML = "";

            if (selectedFiles.length === 0) {
                previewGrid.style.display = "none";
                previewCount.innerText = "";
                document.getElementById("file-input").value = "";
                return;
            }

            previewGrid.style.display = "grid";
            previewCount.innerText = `📷 選択中: ${selectedFiles.length}枚`;

            selectedFiles.forEach((file, idx) => {
                const item = document.createElement("div");
                item.className = "preview-item";

                const img = document.createElement("img");
                img.src = URL.createObjectURL(file);
                img.onload = () => URL.revokeObjectURL(img.src);

                const removeBtn = document.createElement("button");
                removeBtn.className = "remove-btn";
                removeBtn.innerHTML = "×";
                removeBtn.title = "この写真を削除";
                removeBtn.type = "button";
                removeBtn.onclick = (e) => {
                    e.stopPropagation();
                    removeFile(idx);
                };

                item.appendChild(img);
                item.appendChild(removeBtn);
                previewGrid.appendChild(item);
            });

            // 💡 サムネイルが全表示されたタイミングで「送信ボタン」と「戻るボタン」が画面内に収まるようスクロール
            if (isNewSelection) {
                setTimeout(() => {
                    const actionArea = document.getElementById("action-area");
                    if (actionArea) {
                        actionArea.scrollIntoView({ behavior: "smooth", block: "end" });
                    }
                }, 100);
            }
        }

        // 1枚のファイルをBase64変換してGASへアップロードする関数（Promise）
        function uploadSingleFile(file, yearMonth, eventContent, uploaderName, index, total) {
            return new Promise((resolve, reject) => {
                const cleanEvent = eventContent.replace(/[,/_\s]/g, "");
                const cleanUploader = uploaderName.replace(/[,/_\s]/g, "");

                const lastDotIndex = file.name.lastIndexOf(".");
                const originalName = lastDotIndex !== -1 ? file.name.substring(0, lastDotIndex) : file.name;
                const extension = lastDotIndex !== -1 ? file.name.substring(lastDotIndex) : "";
                const cleanOriginalName = originalName.replace(/[,/_\s]/g, "-");

                // ファイル名の整形
                const newFileName = `${cleanEvent}_${cleanOriginalName}_${cleanUploader}_${index + 1}${extension}`;

                const reader = new FileReader();
                reader.onerror = () => reject(new Error(`${file.name} の読み込みに失敗しました`));
                reader.onload = (e) => {
                    const base64Data = e.target.result.split(",")[1];
                    const payload = {
                        action: "upload",
                        folder: yearMonth,
                        filename: newFileName,
                        mimeType: file.type || "image/jpeg",
                        data: base64Data
                    };

                    fetch(GAS_WEBAPP_URL, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify(payload)
                    })
                    .then(res => res.text())
                    .then(text => {
                        let data;
                        try {
                            data = JSON.parse(text);
                        } catch (err) {
                            throw new Error(`サーバー返答の解析エラー: ${text.substring(0, 80)}`);
                        }
                        if (data.success) {
                            resolve(data);
                        } else {
                            reject(new Error(data.error || data.message || "アップロードに失敗しました"));
                        }
                    })
                    .catch(err => reject(err));
                };
                reader.readAsDataURL(file);
            });
        }

        // 🚀 複数写真の一括アップロード処理
        async function uploadPhotos() {
            const select = document.getElementById("event-select");
            const selectedOption = select.options[select.selectedIndex];
            const yearMonth = select.value;
            const eventContent = selectedOption ? selectedOption.dataset.content : "";
            const uploaderName = document.getElementById("uploader-name").value.trim();
            const statusArea = document.getElementById("status-area");
            const btnUpload = document.getElementById("btn-upload");
            const progressContainer = document.getElementById("progress-container");
            const progressBar = document.getElementById("progress-bar");

            // バリデーション
            if (!yearMonth || !eventContent) {
                statusArea.className = "status-msg error";
                statusArea.innerText = "対象のイベントを選択してください。";
                return;
            }
            if (!uploaderName) {
                statusArea.className = "status-msg error";
                statusArea.innerText = "お名前を入力してください。";
                return;
            }
            if (selectedFiles.length === 0) {
                statusArea.className = "status-msg error";
                statusArea.innerText = "写真ファイルを1枚以上選択してください。";
                return;
            }

            const total = selectedFiles.length;
            btnUpload.disabled = true;
            progressContainer.style.display = "block";
            progressBar.style.width = "0%";
            statusArea.className = "status-msg";
            statusArea.style.color = "#44403c";

            let successCount = 0;
            const failedFiles = [];

            for (let i = 0; i < total; i++) {
                const file = selectedFiles[i];
                const currentPercent = Math.round((i / total) * 100);
                progressBar.style.width = `${currentPercent}%`;
                statusArea.innerText = `送信中... (${i + 1} / ${total}枚目)\n${file.name}`;

                try {
                    await uploadSingleFile(file, yearMonth, eventContent, uploaderName, i, total);
                    successCount++;
                } catch (err) {
                    console.error(`[Upload Error] File: ${file.name}`, err);
                    failedFiles.push(`${file.name}: ${err.message}`);
                }

                const completedPercent = Math.round(((i + 1) / total) * 100);
                progressBar.style.width = `${completedPercent}%`;
            }

            btnUpload.disabled = false;

            if (failedFiles.length === 0) {
                statusArea.className = "status-msg success";
                statusArea.innerText = `🎉 ${successCount}枚すべての写真を送信完了しました！\n（約5分後にアルバムに反映されます）`;
                // リセット
                selectedFiles = [];
                updatePreview(false);
                document.getElementById("uploader-name").value = "";
            } else {
                statusArea.className = "status-msg error";
                statusArea.innerText = `⚠️ ${successCount}枚の送信が完了しましたが、${failedFiles.length}枚が失敗しました。\n\n【失敗一覧】\n` + failedFiles.join("\n");
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ウェルネスの森を守る会 | 活動スケジュール</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9f8f6; color: #292524; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; -webkit-font-smoothing: antialiased; }
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; border-b: 1px solid rgba(231, 229, 228, 0.6); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .nav-container { max-width: 1152px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.1em; color: #065f46; margin: 0; }
        
        main { max-width: 600px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; width: 100%; box-sizing: border-box; }
        h2 { font-size: 1.75rem; font-weight: 700; color: #1c1917; margin: 0 0 2rem 0; }
        
        /* アルバムと同系統のシンプルな文字リンク一覧 */
        .schedule-list { display: flex; flex-direction: column; gap: 1rem; text-align: center; margin-bottom: 2.5rem; }
        .schedule-link { font-size: 1.15rem; font-weight: 700; color: #059669; text-decoration: none; transition: color 0.2s; }
        .schedule-link:hover { color: #047857; text-decoration: underline; }

        /* スケジュール表示カード */
        .info-card { background-color: white; border-radius: 1.5rem; padding: 2.5rem 1.5rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid #e7e5e4; margin-bottom: 2rem; text-align: left; }
        .info-section { margin-bottom: 1.75rem; }
        .info-section:last-of-type { margin-bottom: 0; }
        .info-label { font-size: 0.85rem; color: #059669; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
        .info-value { font-size: 1.35rem; font-weight: 700; color: #1c1917; line-height: 1.4; }
        
        /* 集合場所地図画像エリア */
        .map-container { width: 100%; border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-top: 0.75rem; display: none; border: 1px solid #e7e5e4; }
        .map-img { width: 100%; height: auto; display: block; border: none; }
        
        #status-message { font-size: 1rem; color: #78716c; padding: 2rem 0; }
        
        /* ボタン設定・ナビゲーション */
        .btn-container { margin-top: 2rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
        
        /* ＜ ＞ ページ送りボタンエリア */
        .pagination-container { display: flex; gap: 1.5rem; justify-content: center; width: 100%; }
        .page-btn { background-color: white; color: #065f46; border: 1px solid #065f46; font-weight: 700; font-size: 1.25rem; padding: 0.5rem 2rem; border-radius: 0.75rem; cursor: pointer; transition: all 0.2s; }
        .page-btn:hover:not(:disabled) { background-color: #065f46; color: white; }
        .page-btn:disabled { color: #d6d3d1; border-color: #e7e5e4; background-color: #f5f5f4; cursor: not-allowed; }

        .back-btn { display: inline-block; background-color: transparent; color: #57534e; border: 1px solid #d6d3d1; font-weight: 500; font-size: 0.95rem; padding: 0.6rem 2rem; border-radius: 0.75rem; text-decoration: none; transition: all 0.2s; cursor: pointer; }
        .back-btn:hover { background-color: #f5f5f4; color: #2c2a29; }
        footer { background-color: #1c1917; color: #a8a29e; padding: 2rem 0; text-align: center; font-size: 0.75rem; border-top: 1px solid #292524; margin-top: auto; }
        
        @media (max-width: 768px) { h2 { font-size: 1.4rem; } .info-value { font-size: 1.15rem; } }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <h1>ウェルネスの森を守る会</h1>
        </div>
    </header>

    <main>
        <h2 id="page-title">今後の活動予定</h2>
        
        <div id="status-message">予定表を読み込んでいます…</div>

        <!-- 📅 1. 日付一覧を表示する領域（年月日＋曜日付きシンプル文字リンク） -->
        <div id="schedule-list" class="schedule-list" style="display: none;"></div>

        <!-- 📝 2. 詳細情報を表示するカードエリア -->
        <div id="schedule-card" class="info-card" style="display: none;">
            <div class="info-section">
                <div class="info-label">📝 活動内容</div>
                <div id="activity-title" class="info-value">-</div>
            </div>

            <div class="info-section">
                <div class="info-label">📅 活動日時</div>
                <div id="activity-datetime" class="info-value">----年--月--日（-） --:--</div>
            </div>
            
            <div class="info-section">
                <div class="info-label">📍 集合場所</div>
                <div id="activity-place" class="info-value">-</div>
                
                <div id="map-area" class="map-container">
                    <img id="place-image" src="" alt="集合場所地図" class="map-img">
                </div>
            </div>
        </div>

        <!-- 最下段ボタンエリア -->
        <div class="btn-container">
            <!-- 詳細表示時のみ現れる ＜ ＞ ナビゲーション -->
            <div id="pagination-area" class="pagination-container" style="display: none;">
                <button id="prev-btn" class="page-btn" onclick="changeEvent(-1)" aria-label="前の予定">❮</button>
                <button id="next-btn" class="page-btn" onclick="changeEvent(1)" aria-label="次の予定">❯</button>
            </div>

            <button id="back-to-list-btn" onclick="showListMode()" class="back-btn" style="display: none;">一覧に戻る</button>
            <a href="top.html" id="back-to-top-btn" class="back-btn">トップページに戻る</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ウェルネスの森を守る会. All rights reserved.</p>
    </footer>

    <script>
        const csvUrl = 'activity.csv';
        let eventsList = [];
        let currentIndex = 0;

        async function initSchedule() {
            const statusEl = document.getElementById('status-message');

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('予定表の取得に失敗しました');
                
                const text = await response.text();
                const lines = text.split('\n').map(line => line.trim()).filter(line => line !== '');
                
                const today = new Date();
                today.setHours(0, 0, 0, 0); // 今日以降の判定（時刻リセット）

                eventsList = [];

                for (let line of lines) {
                    const columns = line.split(',');
                    if (columns.length < 5) continue;

                    const dateStr = columns[0].trim();
                    const eventDate = new Date(dateStr);

                    // 日付変換できるかつ、今日以降の「今後の予定」のみを抽出
                    if (!isNaN(eventDate.getTime()) && eventDate >= today) {
                        eventsList.push({
                            date: dateStr,
                            time: columns[1].trim(),
                            title: columns[2].trim(),
                            place: columns[3].trim(),
                            map: columns[4].trim()
                        });
                    }
                }

                // 日付昇順（近い順）に並び替え
                eventsList.sort((a, b) => new Date(a.date) - new Date(b.date));

                if (eventsList.length > 0) {
                    statusEl.style.display = 'none';
                    showListMode();
                } else {
                    statusEl.textContent = '近日中にお知らせします。';
                }

            } catch (error) {
                console.error(error);
                statusEl.textContent = '予定表の読み込み中にエラーが発生しました。';
            }
        }

        // 一覧画面を表示（2026年8月7日（金）形式の文字リンク）
        function showListMode() {
            document.getElementById('page-title').textContent = '今後の活動予定';
            document.getElementById('schedule-card').style.display = 'none';
            document.getElementById('pagination-area').style.display = 'none';
            document.getElementById('back-to-list-btn').style.display = 'none';
            document.getElementById('back-to-top-btn').style.display = 'inline-block';

            const listEl = document.getElementById('schedule-list');
            listEl.innerHTML = '';

            eventsList.forEach((event, index) => {
                const link = document.createElement('a');
                link.href = '#';
                link.className = 'schedule-link';
                // 「2026年8月7日（金）」形式でセット
                link.textContent = formatWithDayOfWeek(event.date); 
                link.onclick = (e) => {
                    e.preventDefault();
                    showDetailMode(index);
                };
                listEl.appendChild(link);
            });

            listEl.style.display = 'flex';
        }

        // 詳細画面を表示
        function showDetailMode(index) {
            currentIndex = index;
            const event = eventsList[currentIndex];

            document.getElementById('page-title').textContent = '活動予定の詳細';
            document.getElementById('schedule-list').style.display = 'none';
            
            // データをセット
            document.getElementById('activity-title').textContent = event.title;
            document.getElementById('activity-datetime').textContent = `${formatWithDayOfWeek(event.date)} ${event.time}`;
            document.getElementById('activity-place').textContent = event.place;
            
            const imgEl = document.getElementById('place-image');
            imgEl.src = `${event.map}.png`;
            document.getElementById('map-area').style.display = 'block';

            document.getElementById('schedule-card').style.display = 'block';
            document.getElementById('pagination-area').style.display = 'flex';
            document.getElementById('back-to-list-btn').style.display = 'inline-block';
            document.getElementById('back-to-top-btn').style.display = 'none';

            updatePaginationButtons();
        }

        // 前後の予定に切り替え
        function changeEvent(direction) {
            const newIndex = currentIndex + direction;
            if (newIndex >= 0 && newIndex < eventsList.length) {
                showDetailMode(newIndex);
            }
        }

        // ＜ ＞ ボタンのグレーアウト制御
        function updatePaginationButtons() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            prevBtn.disabled = (currentIndex === 0);
            nextBtn.disabled = (currentIndex === eventsList.length - 1);
        }

        // 日付文字列（yyyy/mm/dd）から「yyyy年m月d日（曜）」を自動作成する関数
        function formatWithDayOfWeek(dateStr) {
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;

            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dayName = days[date.getDay()];

            const year = date.getFullYear();
            const month = date.getMonth() + 1; // 1〜12（ゼロ埋めなし）
            const day = date.getDate();        // 1〜31（ゼロ埋めなし）

            return `${year}年${month}月${day}日（${dayName}）`;
        }

        window.addEventListener('DOMContentLoaded', initSchedule);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メンバー専用 - ウェルネスの森を守る会</title>

    <!-- 🖼️ タブアイコン -->
    <link rel="icon" href="logo.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: #f9f8f6; 
            color: #292524; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            -webkit-font-smoothing: antialiased; 
        }

        /* 画面中央に必要最小限のカードのみ配置 */
        main { 
            max-width: 400px; 
            width: 90%; 
            padding: 1rem; 
            box-sizing: border-box; 
        }
        
        .auth-card { 
            background-color: white; 
            border-radius: 1rem; 
            padding: 1.75rem 1.5rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08); 
            border: 1px solid #e7e5e4; 
            text-align: center; 
        }
        
        h2 { 
            font-size: 1.15rem; 
            font-weight: 700; 
            color: #1c1917; 
            margin: 0 0 1.25rem 0; 
            line-height: 1.4; 
        }
        
        .input-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
            margin-bottom: 1rem; 
            background-color: #fafaf9; 
            border: 1px solid #d6d3d1; 
            border-radius: 0.5rem; 
            box-sizing: border-box; 
        }
        .input-wrapper:focus-within { 
            border-color: #059669; 
            background-color: white; 
            box-shadow: 0 0 0 3px rgba(6, 150, 105, 0.1); 
        }
        
        input[type="password"], input[type="text"] { 
            font-family: 'Noto Sans JP', sans-serif; 
            width: 100%; 
            padding: 0.75rem 3rem 0.75rem 0.75rem; 
            font-size: 0.95rem; 
            border: none; 
            background: transparent; 
            box-sizing: border-box; 
            text-align: center; 
            color: #1c1917; 
            outline: none; 
        }
        
        input::-ms-reveal, input::-ms-clear { display: none !important; }
        input::-webkit-contacts-auto-fill-button, input::-webkit-credentials-auto-fill-button { display: none !important; }
        
        .toggle-password { 
            position: absolute; 
            right: 0.65rem; 
            background: none; 
            border: none; 
            padding: 0; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 22px; 
            height: 22px; 
            color: #78716c; 
            transition: color 0.2s, opacity 0.2s; 
            opacity: 0; 
            pointer-events: none; 
            z-index: 10; 
        }
        .toggle-password:hover { color: #1c1917; }
        .toggle-password.show { opacity: 1; pointer-events: auto; }
        .toggle-password svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 0.75rem 0; 
            border-radius: 0.5rem; 
            font-weight: 500; 
            font-size: 0.95rem; 
            text-decoration: none; 
            transition: all 0.2s; 
            box-sizing: border-box; 
            text-align: center; 
            cursor: pointer; 
            border: none; 
        }
        .btn-submit { background-color: #059669; color: white; box-shadow: 0 2px 4px rgba(6, 150, 105, 0.15); }
        .btn-submit:hover { background-color: #047857; }
        
        .btn-menu { background-color: #115e59; color: white; margin-bottom: 0.75rem; box-shadow: 0 2px 4px rgba(17, 94, 89, 0.15); }
        .btn-menu:hover { background-color: #134e4a; }
        
        .btn-logout { background-color: #f3f4f6; color: #4b5563; border: 1px solid #d1d5db; margin-top: 1.25rem; }
        .btn-logout:hover { background-color: #e5e7eb; color: #111827; }

        .btn-back { background-color: #e7e5e4; color: #44403c; border: 1px solid #d6d3d1; margin-top: 0.5rem; }
        .btn-back:hover { background-color: #d6d3d1; }
        
        .error-msg { color: #b91c1c; font-size: 0.8rem; font-weight: 500; margin-top: 0.5rem; min-height: 1rem; line-height: 1.4; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <main>
        <div class="auth-card">
            <!-- 🚪 1. パスワード入力画面 -->
            <div id="auth-section">
                <h2>🔒 パスワードが必要です</h2>
                
                <div class="input-wrapper">
                    <input type="password" id="pw-input" inputmode="url" autocomplete="new-password" placeholder="パスワードを入力してください" oninput="handleInput()">
                    
                    <button type="button" class="toggle-password" id="toggle-pw-btn" onclick="togglePasswordVisibility()" title="パスワードの表示・非表示">
                        <svg id="eye-icon" viewBox="0 0 24 24">
                            <path d="M 3 14 A 10 9 0 0 1 21 14"></path>
                            <circle cx="12" cy="14" r="2.5" fill="currentColor"></circle>
                        </svg>
                    </button>
                </div>
                <button class="btn btn-submit" onclick="checkPassword()">専用ページに移ります</button>
                <div id="error-area" class="error-msg"></div>
            </div>

            <!-- 🎯 2. メンバー専用メニュー画面 -->
            <div id="menu-section" class="hidden">
                <h2>👥 メンバー専用メニュー</h2>
                
                <a href="sanka.html" class="btn btn-menu">✍️ 出欠の入力</a>
                <a href="shashin_up2.html" class="btn btn-menu">📸 画像のアップ</a>
                
                <button type="button" class="btn btn-logout" onclick="logout()">🔒 ログアウト</button>
                <a href="top.html" class="btn btn-back">↩️ Topページに戻る</a>
            </div>
        </div>
    </main>

    <script>        
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz4x4ENhGVuVkh8kTKa4svHBq7UxzT4UtAPvQqRZvvGPN_AKDImD7bm9I6GvvsAPJ3Txg/exec";
        const TIMEOUT_MINUTES = 10;
        const INACTIVE_TIMEOUT = TIMEOUT_MINUTES * 60 * 1000;

        function clearMemberAuth() {
            localStorage.removeItem("isMemberAuthenticated");
            localStorage.removeItem("authTimestamp");
            sessionStorage.removeItem("isMemberAuthenticated");
        }

        function extendSession() {
            if (localStorage.getItem("isMemberAuthenticated") === "true") {
                localStorage.setItem("authTimestamp", new Date().getTime().toString());
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const isAuth = localStorage.getItem("isMemberAuthenticated") || sessionStorage.getItem("isMemberAuthenticated");
            const authTime = localStorage.getItem("authTimestamp");
            const currentTime = new Date().getTime();

            if (isAuth === "true" && authTime && (currentTime - parseInt(authTime, 10) <= INACTIVE_TIMEOUT)) {
                extendSession();
                sessionStorage.setItem("isMemberAuthenticated", "true");
                document.getElementById("auth-section").classList.add("hidden");
                document.getElementById("menu-section").classList.remove("hidden");

                ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(eventType => {
                    window.addEventListener(eventType, extendSession, { passive: true });
                });
            } else {
                clearMemberAuth();
                document.getElementById("auth-section").classList.remove("hidden");
                document.getElementById("menu-section").classList.add("hidden");
            }
        });

        // 即時ログアウト＆index.htmlへ移動
        function logout() {
            clearMemberAuth();
            window.location.href = "index.html";
        }

        document.getElementById("pw-input").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                checkPassword();
            }
        });

        function handleInput() {
            const pwInput = document.getElementById("pw-input");
            const toggleBtn = document.getElementById("toggle-pw-btn");
            if (pwInput.value.length > 0) {
                toggleBtn.classList.add("show");
            } else {
                toggleBtn.classList.remove("show");
            }
        }

        function togglePasswordVisibility() {
            const pwInput = document.getElementById("pw-input");
            const iconSvg = document.getElementById("eye-icon");
            
            if (pwInput.type === "password") {
                pwInput.type = "text";
                iconSvg.innerHTML = '<path d="M 3 14 A 10 9 0 0 1 21 14"></path><circle cx="12" cy="14" r="2.5" fill="currentColor"></circle>';
            } else {
                pwInput.type = "password";
                iconSvg.innerHTML = '<path d="M 3 14 A 10 9 0 0 1 21 14"></path><circle cx="12" cy="14" r="2.5" fill="currentColor"></circle><line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>';
            }
        }

        function hankakuConvert(str) {
            return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            }).replace(/ /g, " ");
        }

        function checkPassword() {
            const pwInput = document.getElementById("pw-input");
            let userInput = pwInput.value.trim();
            userInput = hankakuConvert(userInput);
    
            const errorArea = document.getElementById("error-area");
    
            if (!userInput) {
                errorArea.innerText = "パスワードを入力してください。";
                errorArea.style.color = "#b91c1c";
                return;
            }

            errorArea.innerText = "認証中...";
            errorArea.style.color = "#059669";

            fetch(GAS_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: JSON.stringify({
                    action: "checkPassword",
                    password: userInput
                })
            })
            .then(response => {
                if (!response.ok) throw new Error("ネットワークエラー");
                return response.json();
            })
            .then(data => {
                if (data && data.matched === true) {
                    errorArea.innerText = "";
                    localStorage.setItem("isMemberAuthenticated", "true");
                    sessionStorage.setItem("isMemberAuthenticated", "true");
                    localStorage.setItem("authTimestamp", new Date().getTime().toString());

                    document.getElementById("auth-section").classList.add("hidden");
                    document.getElementById("menu-section").classList.remove("hidden");

                    ["mousemove", "keydown", "click", "scroll", "touchstart"].forEach(eventType => {
                        window.addEventListener(eventType, extendSession, { passive: true });
                    });
                } else {
                    errorArea.innerHTML = "パスワードが違います。<br>最新のパスワードは世話人から貰ってください。";
                    errorArea.style.color = "#b91c1c";
                }
            })
            .catch(error => {
                console.error(error);
                errorArea.innerHTML = "認証エラーが発生しました。<br>最新のパスワードは世話人から貰ってください。";
                errorArea.style.color = "#b91c1c";
            });
        } 
    </script>
</body>
</html>

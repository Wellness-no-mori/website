<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- 全ページ共通 お気に入り・タブ用アイコン -->
    <link rel="icon" href="logo.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <title>私たちについて | ウェルネスの森を守る会</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9f8f6; color: #292524; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; -webkit-font-smoothing: antialiased; }
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(231, 229, 228, 0.6); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .nav-container { max-width: 1152px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; position: relative; }
        h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.05em; color: #065f46; margin: 0; white-space: nowrap; }
        
        /* 三本線アイコンボタン */
        .menu-btn {
            background: none;
            border: 1px solid #d6d3d1;
            border-radius: 0.375rem;
            font-size: 1.25rem;
            padding: 0.25rem 0.6rem;
            cursor: pointer;
            color: #065f46;
            line-height: 1;
        }
        .menu-btn:hover { background-color: #f0fdf4; }

        /* ポップアップドロップダウンメニュー */
        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 1.5rem;
            background-color: white;
            border: 1px solid #e7e5e4;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            min-width: 160px;
            overflow: hidden;
            z-index: 100;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-menu a {
            display: block;
            padding: 0.75rem 1rem;
            color: #292524;
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px solid #f5f5f4;
            transition: background-color 0.2s;
        }
        .dropdown-menu a:last-child { border-bottom: none; }
        .dropdown-menu a:hover { background-color: #f0fdf4; color: #065f46; }
        .dropdown-menu a.logout-link { color: #ef4444; }
        .dropdown-menu a.logout-link:hover { background-color: #fef2f2; }

        main { max-width: 896px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem 1.5rem; text-align: center; width: 100%; box-sizing: border-box; }
        h2 { font-size: 1.6rem; font-weight: 700; color: #1c1917; margin: 0 0 2rem 0; text-align: center; }

        /* aboutus.txt 表示カード */
        .content-card {
            background-color: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e7e5e4;
            text-align: left;
            line-height: 1.8;
            font-size: 1rem;
            color: #44403c;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading-text { font-size: 1rem; color: #78716c; padding: 2rem 0; }

        /* 共通フッター */
        footer { 
            background-color: #1c1917; 
            padding: 2rem 1.5rem; 
            border-top: 1px solid #292524; 
            margin-top: 5rem; 
        }
        .footer-container { 
            max-width: 896px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 0.75rem; 
        }
        .copyright { 
            margin: 0; 
            color: #78716c; 
            font-size: 0.75rem; 
            text-align: center; 
        }

        @media (max-width: 640px) { 
            h1 { font-size: 1.1rem; }
            h2 { font-size: 1.35rem; } 
            .content-card { padding: 1.25rem; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <h1>ウェルネスの森を守る会</h1>
            <!-- 三本線ボタン -->
            <button class="menu-btn" id="menuBtn" aria-label="メニューを開く">☰</button>
            <!-- クリック時に表示されるドロップダウンメニュー -->
            <nav class="dropdown-menu" id="dropdownMenu">
                <a href="top.html">メインページ</a>
                <a href="news.html">お知らせ</a>
                <a href="schedule.html">活動予定</a>
                <a href="album.html">アルバム</a>
                <a href="member.html">メンバー専用</a>
                <a href="javascript:void(0)" onclick="handleLogout()" class="logout-link">ログアウト</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>私たちについて</h2>
        
        <div id="loading" class="loading-text">情報を読み込んでいます…</div>
        <div id="about-content" class="content-card" style="display: none;"></div>
    </main>

    <footer>
        <div class="footer-container">
            <p class="copyright">&copy; 2026 ウェルネスの森を守る会. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // 三本線メニューの開閉制御
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('show');
        });

        document.addEventListener('click', () => {
            dropdownMenu.classList.remove('show');
        });

        // =================================================================
        // 🔒 認証・セッション管理処理
        // =================================================================
        const TIMEOUT_MINUTES = 10;
        const INACTIVE_TIMEOUT = TIMEOUT_MINUTES * 60 * 1000;

        function clearMemberAuth() {
            localStorage.removeItem("isMemberAuthenticated");
            localStorage.removeItem("authTimestamp");
            sessionStorage.removeItem("isMemberAuthenticated");
        }

        function handleLogout() {
            clearMemberAuth();
            window.location.href = "index.html";
        }

        function updateSessionTimestamp() {
            if (localStorage.getItem("isMemberAuthenticated") === "true") {
                const authTime = localStorage.getItem("authTimestamp");
                const currentTime = new Date().getTime();

                if (authTime && (currentTime - parseInt(authTime, 10) > INACTIVE_TIMEOUT)) {
                    clearMemberAuth();
                } else {
                    localStorage.setItem("authTimestamp", currentTime.toString());
                }
            }
        }

        const userEvents = ['click', 'keydown', 'scroll', 'touchstart', 'mousemove'];
        userEvents.forEach(eventType => {
            window.addEventListener(eventType, updateSessionTimestamp, { passive: true });
        });

        updateSessionTimestamp();

        // =================================================================
        // 📄 aboutus.txt 読み込み処理
        // =================================================================
        async function loadAboutUsText() {
            const loadingEl = document.getElementById('loading');
            const contentEl = document.getElementById('about-content');

            try {
                const response = await fetch('aboutus.txt?t=' + new Date().getTime());
                if (!response.ok) throw new Error('aboutus.txtの取得に失敗しました');

                const text = await response.text();
                contentEl.textContent = text.trim();

                loadingEl.style.display = 'none';
                contentEl.style.display = 'block';

            } catch (error) {
                console.error(error);
                loadingEl.textContent = '情報の読み込みに失敗しました。';
            }
        }

        window.addEventListener('DOMContentLoaded', loadAboutUsText);
    </script>
</body>
</html>

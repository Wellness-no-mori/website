<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <!-- 全ページ共通 お気に入り・タブ用アイコン指定 -->
    <link rel="icon" href="logo.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="logo.png?v=2">

    <title>ウェルネスの森を守る会</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f9f8f6; color: #292524; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; -webkit-font-smoothing: antialiased; }
        header { background-color: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; border-bottom: 1px solid rgba(231, 229, 228, 0.6); box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .nav-container { max-width: 1152px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.05em; color: #065f46; margin: 0; white-space: nowrap; }
        
        /* ① 右上 ログアウトボタン */
        .logout-btn { background-color: #78716c; color: white; padding: 0.4rem 1rem; border-radius: 0.5rem; text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: background-color 0.2s; white-space: nowrap; border: none; cursor: pointer; }
        .logout-btn:hover { background-color: #57534e; }

        main { max-width: 896px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem 1.5rem; text-align: center; width: 100%; box-sizing: border-box; }
        h2 { font-size: 1.6rem; font-weight: 700; color: #1c1917; margin: 0 0 1.5rem 0; line-height: 1.5; letter-spacing: -0.025em; }
        
        .img-container { margin: 1.5rem auto 1.25rem auto; max-width: 768px; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 20px -5px rgba(0, 0, 0, 0.08); }
        .main-img { width: 100%; height: auto; display: block; border-radius: 20px; border: none; }
        
        /* ④ 画像直下の説明文 */
        .description { color: #57534e; max-width: 768px; margin: 0 auto 2.5rem auto; font-size: 0.95rem; line-height: 1.8; text-align: left; }

        /* ⑤ 田の字（2列×2行）配置 */
        .action-buttons-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 1.25rem; 
            max-width: 768px; 
            margin: 0 auto; 
        }
        
        .grid-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 1.125rem 1rem; 
            border-radius: 0.85rem; 
            font-weight: 700; 
            font-size: 1rem; 
            text-decoration: none; 
            transition: all 0.2s; 
            box-sizing: border-box; 
            text-align: center; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .grid-btn:hover { transform: translateY(-2px); }

        .btn-news { background-color: #f4ecee; color: #834e59; border: 1px solid #e8d5d8; }
        .btn-news:hover { background-color: #ebdce0; }
        
        .btn-schedule { background-color: #115e59; color: white; }
        .btn-schedule:hover { background-color: #134e4a; }
        
        .btn-album { background-color: #e7e5e4; color: #44403c; border: 1px solid #d6d3d1; }
        .btn-album:hover { background-color: #d6d3d1; }

        .btn-member { background-color: #059669; color: white; box-shadow: 0 10px 15px -3px rgba(6, 150, 105, 0.25); }
        .btn-member:hover { background-color: #047857; }

        /* ② フッター定義（版権：上段・中央 / リンク：下段・中央と左の中間位置） */
        footer { 
            background-color: #1c1917; 
            padding: 2rem 1.5rem; 
            border-top: 1px solid #292524; 
            margin-top: 5rem; 
        }
        .footer-container { 
            max-width: 896px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 0.75rem; 
        }
        .copyright { 
            margin: 0; 
            color: #78716c; 
            font-size: 0.75rem; 
            text-align: center; 
        }
        .footer-nav { 
            text-align: left; 
            padding-left: 15%; /* 中央と左端のちょうど中間位置へ配置 */
            box-sizing: border-box;
        }
        .footer-link { 
            color: #78716c; 
            text-decoration: none; 
            font-size: 0.75rem; 
            transition: color 0.2s; 
        }
        .footer-link:hover { color: #34d399; }

        /* ⑤ 📱 スマホ表示用メディアクエリ */
        @media (max-width: 640px) { 
            h1 { font-size: 1.1rem; }
            h2 { font-size: 1.35rem; } 
            .action-buttons-grid { grid-template-columns: 1fr; gap: 0.85rem; }
            .grid-btn { padding: 1rem; }
            .description { font-size: 0.9rem; }
            .footer-nav { padding-left: 10%; } /* スマホ画面では少し左寄りにして可読性を確保 */
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <h1>ウェルネスの森を守る会</h1>
            <!-- ① ログアウトボタン（即時セッション破棄） -->
            <button onclick="handleLogout()" class="logout-btn">ログアウト</button>
        </div>
    </header>

    <main>
        <h2>六甲のグリーンベルトを守り、地域の保全を確保する活動です</h2>
        
        <div class="img-container">
            <img src="main-visual.jpg" alt="ウェルネスの森を守る会 メインビジュアル" class="main-img">
        </div>

        <!-- ④ 画像直下の説明文 -->
        <p class="description">
            六甲山の魚屋道沿いの下草を払い、日本由来の樹木を植林する活動を概ね月に1回程度、実施しています。今後の活動スケジュールや活動中の画像をご覧いただけます。メンバー限定のコンテンツも用意しています。
        </p>

        <!-- ⑤ 田の字（2列×2行）配置の4ボタン -->
        <div class="action-buttons-grid">
            <a href="news.html" class="grid-btn btn-news">📢 お知らせ・新着情報</a>
            <a href="schedule.html" class="grid-btn btn-schedule">📅 活動予定</a>
            <a href="album.html" class="grid-btn btn-album">📁 アルバム</a>
            <a href="member.html" class="grid-btn btn-member">🔑 メンバー専用ページ ➔</a>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <!-- 上の行：版権表明（中央寄せ） -->
            <p class="copyright">&copy; 2026 ウェルネスの森を守る会. All rights reserved.</p>
            
            <!-- 下の行：私たちについて（左と中央の中間に配置・版権と同サイズ＆同色） -->
            <div class="footer-nav">
                <a href="aboutus.html" class="footer-link">私たちについて</a>
            </div>
        </div>
    </footer>

    <script>
        const TIMEOUT_MINUTES = 10;
        const INACTIVE_TIMEOUT = TIMEOUT_MINUTES * 60 * 1000; // 10分（ミリ秒）

        // 認証情報を完全削除する共通関数
        function clearMemberAuth() {
            localStorage.removeItem("isMemberAuthenticated");
            localStorage.removeItem("authTimestamp");
        }

        // タイムスタンプ更新（ログイン中のみ上書き）
        function updateSessionTimestamp() {
            if (localStorage.getItem("isMemberAuthenticated") === "true") {
                localStorage.setItem("authTimestamp", new Date().getTime().toString());
            }
        }

        // 放置状態チェック
        function checkAuthSession() {
            const isAuth = localStorage.getItem("isMemberAuthenticated");
            const authTime = localStorage.getItem("authTimestamp");

            // ログインしていない場合はスキップ
            if (isAuth !== "true" || !authTime) return;

            const currentTime = new Date().getTime();
            // 10分以上放置されている場合
            if (currentTime - parseInt(authTime, 10) > INACTIVE_TIMEOUT) {
                clearMemberAuth(); // 両方のフラグを破棄
                alert(`${TIMEOUT_MINUTES}分間操作がなかったため、自動ログアウトしました。`);
                window.location.href = "index.html"; // 入口へ移動
            }
        }

        // ログアウト処理（ボタン押下時に完全消去して index.html へ）
        function handleLogout() {
            clearMemberAuth(); // isMemberAuthenticated と authTimestamp の両方を消去
            window.location.href = "index.html";
        }

        // ユーザーの操作を検知してタイマー延長
        const userEvents = ['click', 'keydown', 'scroll', 'touchstart', 'mousemove'];
        userEvents.forEach(eventType => {
            window.addEventListener(eventType, () => {
                const isAuth = localStorage.getItem("isMemberAuthenticated");
                const authTime = localStorage.getItem("authTimestamp");
                
                // ログイン済み かつ 10分以内の場合のみ延長
                if (isAuth === "true" && authTime && (new Date().getTime() - parseInt(authTime, 10) <= INACTIVE_TIMEOUT)) {
                    updateSessionTimestamp();
                }
            }, { passive: true });
        });

        // ページ読み込み時のチェック ＆ 1分間隔の定常監視
        checkAuthSession();
        setInterval(checkAuthSession, 60000);
    </script>

    </body>
</html>
